<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>YTAH Prototype</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3efe5;color:#202421;font-family:Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}main{max-width:520px}h1{font-family:Georgia,serif;font-weight:400;font-size:42px;color:#17352c;margin:0 0 16px}p{line-height:1.7}a{color:#17352c;font-weight:700}
  </style>
</head>
<body>
  <main><h1>Page not found.</h1><p>This is the YTAH 30th anniversary prototype.</p><p><a id="home" href="./">Return to the homepage</a></p></main>
  <script>
    (function(){
      if(location.hostname.endsWith('github.io')){
        var parts=location.pathname.split('/').filter(Boolean);
        document.getElementById('home').href=parts.length ? '/' + parts[0] + '/' : '/';
      }
    }());
  </script>
</body>
</html>
